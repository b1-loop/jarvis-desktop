# Runs the same checks as CI, locally, before every commit.
# Install once with: uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict

  # ruff and mypy run from the project environment, not from isolated mirror
  # repos: uv.lock is the single source of truth for their versions, so the
  # hook, `uv run ruff` in a terminal and CI can never disagree. (A pinned
  # ruff-pre-commit rev drifted to v0.7.4 while the venv ran 0.17, and the two
  # versions fought over which `noqa` comments were needed.) --force-exclude
  # applies `extend-exclude` from pyproject.toml to the file names pre-commit
  # passes explicitly, so native/third_party stays untouched.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

  # clang-format is pinned here and only here. CI runs this same hook (see
  # .github/workflows/ci.yml) instead of whatever LLVM the runner image ships,
  # and the major version matches the LLVM 23 on the development machine, so
  # an editor's format-on-save agrees with the check.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
        files: ^native/(?!third_party/)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
