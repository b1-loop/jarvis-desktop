[project]
name = "jarvis"
version = "0.1.0"
description = "Voice-controlled personal AI assistant for the desktop. Python is the conductor, C++ is the muscle."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bozhidar Ivanov" }]
keywords = ["voice-assistant", "llm", "agent", "pybind11", "whisper", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]

dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "typer>=0.15",
  "numpy>=2.1",
  "aiosqlite>=0.20",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
  "httpx>=0.27",
  "tzdata>=2024.1", # IANA zones for zoneinfo on Windows, which ships none
]

[project.optional-dependencies]
# Cloud mode: hosted LLM + local-GPU/CPU STT + cloud TTS.
cloud = ["faster-whisper>=1.1", "edge-tts>=6.1"]
# Semantic memory. Separate extra because ChromaDB pulls heavy dependencies.
memory = ["chromadb>=0.5"]
# Integrations that need third-party SDKs; each provider is optional.
integrations = [
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "msal>=1.31",
  "spotipy>=2.24",
  "slack-sdk>=3.33",
  "discord.py>=2.4",
]
# Files and documents.
documents = ["pypdf>=5.0", "python-docx>=1.1", "youtube-transcript-api>=0.6"]
# System monitoring and tray icon.
desktop = ["psutil>=6.0", "pystray>=0.19", "pillow>=11.0"]
all = ["jarvis[cloud,memory,integrations,documents,desktop]"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[project.urls]
Homepage = "https://github.com/b1-loop/jarvis-desktop"
Repository = "https://github.com/b1-loop/jarvis-desktop"

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
  "pre-commit>=4.0",
  "pybind11>=2.13",
  "pybind11-stubgen>=2.5",
  "types-PyYAML>=6.0",
  "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
# Compiled extension modules are produced by scripts/build_native.py and
# dropped into src/jarvis/_native/. See docs/adr/0002-decoupled-native-build.md.
artifacts = ["src/jarvis/_native/*.pyd", "src/jarvis/_native/*.so"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
# Agent worktrees live under .claude/ inside the checkout; whisper.cpp and
# llama.cpp ship their own Python scripts with their own style.
extend-exclude = [".claude", "native/third_party"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "RET",       # return
  "ARG",       # unused arguments
  "PTH",       # pathlib over os.path
  "ERA",       # no commented-out code
  "PL",        # pylint subset
  "RUF",       # ruff-specific
  "D",         # pydocstyle (Google style)
  "ASYNC",     # blocking calls in async code
  "S",         # bandit security
  "T20",       # no stray print()
]
ignore = [
  "D105",    # magic method docstrings add noise
  "D107",    # __init__ documented on the class
  "PLR0913", # argument counts are handled by DI, not a hard cap
  "S101",    # assert is the pytest idiom
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S105", "S106", "PLR2004", "ARG001", "ARG002"]
"scripts/**" = ["T20", "S603", "S607"] # dev scripts print and run fixed commands
"src/jarvis/__main__.py" = ["T20"] # CLI entry point prints by design
# Optional-extra parsers are imported inside the functions that need them.
"src/jarvis/integrations/documents.py" = ["PLC0415"]
"src/jarvis/integrations/youtube.py" = ["PLC0415"]
"src/jarvis/tools/draft_document.py" = ["PLC0415"]

[tool.ruff.lint.pylint]
max-statements = 30   # Clean Code: functions under 30 lines

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
mypy_path = "src"
packages = ["jarvis"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without type stubs. Each entry is a known gap, not laziness.
module = [
  "faster_whisper.*",
  "edge_tts.*",
  "chromadb.*",
  "spotipy.*",
  "msal.*",
  "pystray.*",
  "googleapiclient.*",
  "google_auth_oauthlib.*",
  "youtube_transcript_api.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = "-ra --strict-markers --cov=jarvis --cov-report=term-missing:skip-covered --cov-report=xml"
markers = [
  "integration: tests that wire several modules together with mocked I/O",
  "native: tests that require the compiled C++ extensions",
  "hardware: tests that need a real microphone or speakers (never run in CI)",
]
filterwarnings = ["error", "ignore::DeprecationWarning:google.*"]

[tool.coverage.run]
source = ["jarvis"]
branch = true
omit = ["src/jarvis/_native/*"]

[tool.coverage.report]
fail_under = 80
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@overload",
  '\.\.\.$',
]
